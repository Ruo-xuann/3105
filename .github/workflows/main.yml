name: Build 3105

on:
  push:
    branches: [ "ios27-final-support" ]
  pull_request:
    branches: [ "ios27-final-support" ]
  workflow_dispatch:

jobs:
  build:
    name: Build 3105
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            build

      - name: Package app
        run: |
          cd build
          zip -r 3105.app.zip 3105.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: 3105-app
          path: build/3105.app.zip
