name: Build 3105

on:
  push:
    branches: [ "ios27-final-support" ]
  pull_request:
    branches: [ "ios27-final-support" ]
  workflow_dispatch:

jobs:
  build:
    name: Build 3105
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
